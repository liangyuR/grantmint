# Grantmint server configuration.
# Security, caching, and webhook properties are added in later milestones. Keep secrets out
# of this file — the Ed25519 private key is loaded from a private_key_ref pointer
# (file 0600 / env / secret manager), never from config or the DB.
spring:
  application:
    name: grantmint-server

  # PostgreSQL is the only supported datastore (never H2). Overridable via env/secret manager.
  datasource:
    url: ${GRANTMINT_DB_URL:jdbc:postgresql://localhost:5432/grantmint}
    username: ${GRANTMINT_DB_USER:grantmint}
    password: ${GRANTMINT_DB_PASSWORD:grantmint}

  jpa:
    # Flyway owns the schema; Hibernate only validates the mapping against it, never mutates it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  server:
    # Actuator rides its own management port, never the public API port: requests outside the three
    # auth chains bypass security entirely, and /actuator/prometheus leaks capacity, product slugs,
    # and license counts. Bind/firewall this port to the private metrics network
    # (docs/operations/MONITORING_LOGGING.md).
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness & /readiness for container orchestration
  metrics:
    distribution:
      # Histogram buckets so histogram_quantile() p95/p99 PromQL works on the two SLI timers.
      percentiles-histogram:
        grantmint.validation.latency: true
        grantmint.issuance.latency: true
      slo:
        grantmint.validation.latency: 5ms,10ms,25ms,50ms,100ms,250ms

grantmint:
  # OpenAPI doc (/v3/api-docs) + Swagger UI (/swagger-ui) access policy. These sit outside the three
  # functional auth chains. Default is public (the document exposes only the API shape, no secrets);
  # set to `admin` to require an admin session, or `disabled` to stop serving them, in production.
  openapi:
    access: public
  validation:
    rate-limit:
      # Reverse proxies whose X-Forwarded-For may be trusted to carry the real client IP, as CIDRs
      # (or bare IPs). Empty = use the socket peer and ignore the header (cannot be spoofed). Set this
      # to your load balancer / ingress range so the per-IP limit keys on the real client.
      trusted-proxies: []
  lifecycle:
    # How often the expiry-sweep job runs (ISO-8601 duration). It flips active/suspended licenses to
    # expired once expires_at + the license's policy grace period has elapsed.
    expiry-sweep-interval: PT5M
  activation:
    # How often the heartbeat-timeout reaper runs (ISO-8601 duration). It frees seats whose
    # last_heartbeat_at is older than 3x the license's policy heartbeat_interval_seconds.
    reaper-interval: PT5M
