name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    name: Rust binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.91.1 --profile minimal
      - run: cargo +1.91.1 build --manifest-path server/Cargo.toml --locked --release
      - name: Package binaries
        run: |
          mkdir -p release
          cp server/target/release/grantmint-server server/target/release/import-v2 release/
          cp LICENSE docs/api/rust-service.md release/
          tar -czf "grantmint-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" -C release .
          sha256sum "grantmint-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" > "grantmint-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            grantmint-*.tar.gz
            grantmint-*.sha256
          generate_release_notes: true
  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image namespace
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grantmint" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}-server:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          file: dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_BASE }}-dashboard:${{ github.ref_name }}
