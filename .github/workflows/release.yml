# Grantmint release — runs on a semver tag (v0.1.0) pushed by /release, which has
# already bumped every module POM to the tag's version and run `./mvnw verify`.
# Rebuilds from the tagged commit and ships the three distribution artifacts
# (docs/deployment/CI_CD.md, translated from that doc's Gradle sample to the real
# Maven build):
#   1. GraalVM native binaries (linux amd64 + arm64) → attached to a GitHub Release
#   2. Fat JAR fallback → attached to the same Release
#   3. Multi-arch Docker image → GHCR
# plus Maven artifacts, keeping the licensing split honest: the AGPL-3.0
# grantmint-core/grantmint-server and the Apache-2.0 grantmint-spring-boot-starter
# are published as SEPARATE artifacts (separate coordinates, own POM <licenses>).
# Published to GitHub Packages with the built-in GITHUB_TOKEN — no external
# registry credentials; Maven Central would slot in here later via a protected
# environment (see CI_CD.md "Secrets Handling").
#
# 🔒 No GRANTMINT signing secret appears here on purpose: releases never need the
# Ed25519 license-signing key. Operators generate and hold that themselves.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: write # push the image + Maven artifacts to GHCR / GH Packages

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/grantmint-server

jobs:
  release-binaries:
    name: native binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false # one architecture failing must not cancel the other
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM CE 21
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: "21"
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Same two-step dance as ci.yml: native:compile must run on grantmint-server
      # alone (with -am the goal also fires on the aggregator POM and dies with
      # "Image classpath is empty"), so grantmint-core + parent go in first.
      - name: Install grantmint-core
        run: ./mvnw -B -ntp -DskipTests install -pl grantmint-core -am

      - name: Build the native binary
        run: ./mvnw -B -ntp -Pnative -DskipTests -pl grantmint-server native:compile

      - name: Package + checksum
        run: |
          BIN=grantmint-server/target/grantmint-server
          OUT="grantmint-server-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          install -m 0755 "$BIN" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            grantmint-server-${{ github.ref_name }}-${{ matrix.platform }}
            grantmint-server-${{ github.ref_name }}-${{ matrix.platform }}.sha256
          generate_release_notes: true

  release-fatjar:
    name: fat JAR fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the fat JAR
        run: ./mvnw -B -ntp -DskipTests -pl grantmint-server -am package

      # /release ran versions:set before tagging, so the repackaged JAR is
      # grantmint-server-<version>.jar (the .original sidecar doesn't match *.jar).
      - name: Rename + checksum
        run: |
          JAR=(grantmint-server/target/grantmint-server-*.jar)
          OUT="grantmint-server-${GITHUB_REF_NAME}.jar"
          cp "${JAR[0]}" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            grantmint-server-${{ github.ref_name }}.jar
            grantmint-server-${{ github.ref_name }}.jar.sha256
          generate_release_notes: true

  release-image:
    name: Docker image (multi-arch)
    runs-on: ubuntu-latest
    timeout-minutes: 90 # the arm64 half of the Maven build stage runs under QEMU
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built-in; no PAT needed for GHCR

      - name: Build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: . # Maven needs the full reactor — see grantmint-server/Dockerfile
          file: grantmint-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-maven:
    name: publish Maven artifacts (AGPL + Apache, separately)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # server-id "github" writes a settings.xml entry that authenticates the
      # altDeploymentRepository below with GITHUB_ACTOR / GITHUB_TOKEN.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github

      # AGPL-3.0 half first: grantmint-core + grantmint-server, plus the root
      # parent POM both halves reference (consumers can't resolve a child without
      # it). Each module carries its own <licenses> metadata from M0.
      - name: Publish core + server (AGPL-3.0)
        run: >
          ./mvnw -B -ntp -DskipTests
          -pl .,grantmint-core,grantmint-server
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
          deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Apache-2.0 half: the self-contained starter SDK — deployed as its own
      # artifact so downstream apps depend on it without copyleft contagion.
      - name: Publish the starter SDK (Apache-2.0)
        run: >
          ./mvnw -B -ntp -DskipTests
          -pl grantmint-spring-boot-starter
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
          deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
