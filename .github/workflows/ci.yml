# Grantmint CI — the guard rails that otherwise only run on a local `./mvnw verify`:
# unit tests, jqwik property tests (the correctness contract for issuance/signing/
# verification/seats), Testcontainers integration tests against real PostgreSQL 16,
# the ArchUnit boundary/layering rules (crypto core stays Spring-free), Spotless
# formatting, and the Locale.ROOT checkstyle lint. See docs/deployment/CI_CD.md.
#
# Deliberately absent for now:
# - GraalVM native-image build — added when the native profile lands (M13, GRANTMINT-110).
# - dashboard build — M11 is deferred.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (tests + guards)
    runs-on: ubuntu-latest # Docker is available for Testcontainers
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # One command runs everything the build binds into verify: Surefire (unit +
      # jqwik + ArchUnit), the Postgres Testcontainers ITs, spotless:check, and the
      # checkstyle Locale.ROOT lint. Never add -Dapi.version here — that flag is a
      # local OrbStack workaround only (see the developer notes), not for real Docker.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
