name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-client:
    name: Rust protocol and offline SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.91.1 fmt --manifest-path crates/license-protocol/Cargo.toml --check
      - run: cargo +1.91.1 test --manifest-path crates/license-protocol/Cargo.toml --locked
      - run: cargo +1.91.1 clippy --manifest-path crates/license-protocol/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.91.1 fmt --manifest-path verifiers/rust/Cargo.toml --check
      - run: cargo +1.91.1 test --manifest-path verifiers/rust/Cargo.toml --locked
      - run: cargo +1.91.1 clippy --manifest-path verifiers/rust/Cargo.toml --locked --all-targets -- -D warnings
  rust-server:
    name: Rust server and PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: grantmint_test
          POSTGRES_USER: grantmint
          POSTGRES_PASSWORD: grantmint-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grantmint -d grantmint_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://grantmint:grantmint-test-only@localhost:5432/grantmint_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.91.1 fmt --manifest-path server/Cargo.toml --check
      - run: cargo +1.91.1 test --manifest-path server/Cargo.toml --locked
      - run: cargo +1.91.1 clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
  dashboard:
    name: Chinese Web lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  docker:
    name: Docker deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRANTMINT_DB_PASSWORD: ci-only-database-password
      GRANTMINT_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public key registry
        run: cp config/keys.example.json config/keys.json
      - name: Build and start isolated stack
        run: docker compose -p grantmint-ci -f compose.deploy.yml up -d --build --wait
      - name: Probe Web and private health
        run: |
          curl -fsS http://127.0.0.1:8180/ | grep -q 'Grantmint'
          docker compose -p grantmint-ci -f compose.deploy.yml exec -T license-server curl -fsS http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8180/v1/licenses/validate)" = 404
      - name: Logs on failure
        if: failure()
        run: docker compose -p grantmint-ci -f compose.deploy.yml logs --tail 100
      - name: Stop disposable CI stack
        if: always()
        run: docker compose -p grantmint-ci -f compose.deploy.yml down -v
