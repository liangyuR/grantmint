services:
  gateway:
    image: ${GRANTMINT_DASHBOARD_IMAGE:-grantmint-rust-dashboard:local}
    build:
      context: dashboard
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
      ADMIN_ALLOWED_CIDRS: ${GRANTMINT_ADMIN_CIDRS:-private_ranges}
    ports:
      - "127.0.0.1:${GRANTMINT_HTTP_PORT:-8180}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      license-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [frontend]

  license-server:
    image: ${GRANTMINT_SERVER_IMAGE:-grantmint-rust-server:local}
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        RUST_IMAGE: ${RUST_IMAGE:-rust:1.91.1-bookworm}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-debian:bookworm-slim}
    restart: unless-stopped
    environment: &server-environment
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: grantmint
      DB_USER: grantmint
      DB_PASSWORD: ${GRANTMINT_DB_PASSWORD:?Set GRANTMINT_DB_PASSWORD}
      ADMIN_USERNAME: ${GRANTMINT_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${GRANTMINT_ADMIN_PASSWORD:?Set GRANTMINT_ADMIN_PASSWORD}
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: ${GRANTMINT_PUBLIC_ORIGIN:-http://127.0.0.1:8180}
      KEYS_DIR: /keys
      SIGNING_KEYS_FILE: /config/keys.json
    volumes: &server-volumes
      - rust-signing-keys:/keys:ro
      - ${GRANTMINT_KEYS_CONFIG:-./config/keys.json}:/config/keys.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks: [frontend, database]

  migrate:
    image: ${GRANTMINT_SERVER_IMAGE:-grantmint-rust-server:local}
    command: ["migrate"]
    restart: "no"
    environment: *server-environment
    volumes: *server-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: grantmint
      POSTGRES_USER: grantmint
      POSTGRES_PASSWORD: ${GRANTMINT_DB_PASSWORD:?Set GRANTMINT_DB_PASSWORD}
    volumes:
      - rust-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantmint -d grantmint"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [database]

  key-tools:
    image: ${GRANTMINT_SERVER_IMAGE:-grantmint-rust-server:local}
    profiles: [tools]
    network_mode: none
    environment:
      KEYS_DIR: /keys
    volumes:
      - rust-signing-keys:/keys

volumes:
  rust-database:
  rust-signing-keys:
  caddy-data:
  caddy-config:

networks:
  frontend:
  database:
    internal: true
