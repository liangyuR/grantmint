services:
  gateway:
    image: ${GRANTMINT_DASHBOARD_IMAGE:-grantmint-dashboard:local}
    build:
      context: dashboard
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
      ADMIN_ALLOWED_CIDRS: ${GRANTMINT_ADMIN_CIDRS:-private_ranges}
    ports:
      - "127.0.0.1:${GRANTMINT_HTTP_PORT:-8180}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      grantmint-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [frontend]

  grantmint-server:
    image: ${GRANTMINT_SERVER_IMAGE:-grantmint-server:local}
    build:
      context: .
      dockerfile: grantmint-server/Dockerfile
      args:
        JDK_IMAGE: ${JDK_IMAGE:-eclipse-temurin:21-jdk}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre}
    restart: unless-stopped
    environment:
      GRANTMINT_DB_URL: jdbc:postgresql://postgres:5432/grantmint
      GRANTMINT_DB_USER: grantmint
      GRANTMINT_DB_PASSWORD: ${GRANTMINT_DB_PASSWORD:?Set GRANTMINT_DB_PASSWORD}
      GRANTMINT_ADMIN_USERNAME: ${GRANTMINT_ADMIN_USERNAME:-admin}
      GRANTMINT_ADMIN_PASSWORD: ${GRANTMINT_ADMIN_PASSWORD:?Set GRANTMINT_ADMIN_PASSWORD}
      GRANTMINT_ADMIN_SESSION_COOKIESECURE: "false"
    volumes:
      - signing-keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 45s
    networks: [frontend, database]

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: grantmint
      POSTGRES_USER: grantmint
      POSTGRES_PASSWORD: ${GRANTMINT_DB_PASSWORD:?Set GRANTMINT_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grantmint -d grantmint"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [database]

  key-import:
    image: ${GRANTMINT_SERVER_IMAGE:-grantmint-server:local}
    profiles: [tools]
    user: "0"
    network_mode: none
    entrypoint: ["sh"]
    volumes:
      - signing-keys:/keys

volumes:
  database:
  signing-keys:
  caddy-data:
  caddy-config:

networks:
  frontend:
  database:
    internal: true
