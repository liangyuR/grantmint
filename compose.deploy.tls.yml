services:
  gateway:
    environment:
      SITE_ADDRESS: ${GRANTMINT_DOMAIN:?Set GRANTMINT_DOMAIN to a public DNS hostname}
    ports: !override
      - "80:80"
      - "443:443"
  license-server:
    environment:
      COOKIE_SECURE: "true"
      PUBLIC_ORIGIN: https://${GRANTMINT_DOMAIN:?Set GRANTMINT_DOMAIN to a public DNS hostname}
