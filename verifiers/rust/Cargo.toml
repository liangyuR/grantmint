[package]
name = "grantmint-offline"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Device-bound Grantmint v2 offline verification"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = "2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = "1"

[[bin]]
name = "grantmint-offline"
path = "src/main.rs"
